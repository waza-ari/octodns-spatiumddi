[project]
name = "octodns-spatiumddi"
version = "0.1.0"
description = "octoDNS source-only provider for SpatiumDDI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Herrmann", email = "daniel.herrmann1@gmail.com" }]
maintainers = [{ name = "Daniel Herrmann", email = "daniel.herrmann1@gmail.com" }]
keywords = ["octodns", "dns", "spatiumddi", "ddi", "ipam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "octodns>=1.0",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/waza-ari/octodns-spatiumddi"
Repository = "https://github.com/waza-ari/octodns-spatiumddi"
Issues = "https://github.com/waza-ari/octodns-spatiumddi/issues"
Changelog = "https://github.com/waza-ari/octodns-spatiumddi/releases"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octodns_spatiumddi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "RUF",           # ruff-specific
    "SIM",           # simplify
    "TID",           # tidy imports
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["octodns.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=octodns_spatiumddi --cov-report=term-missing"
